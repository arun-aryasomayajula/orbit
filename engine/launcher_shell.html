<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit — Launcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<style>
/* Same visual language as cc_shell.html (deep-space palette), kept fully
   self-contained here — no external fonts/assets, this page must render
   standalone before any project (or its own network) exists. */
:root{
  --void:#060913; --panel:#0D1424; --card:#131C32; --card2:#1A2542; --line:#1F2A44; --line2:#2B3A5C;
  --ink:#E8EDF7; --dim:#8B96AC; --faint:#5A6478;
  --amber:#FFB35C; --amber-dim:#4a3416; --green:#4ADE9C; --green-dim:#0d3526;
  --blue:#7C9CFF; --blue-dim:#182a52; --red:#FF6B7A; --red-dim:#43181d;
  --disp:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --void:#F4F6FB; --panel:#FFFFFF; --card:#F7F9FD; --card2:#EEF1F9; --line:#E1E6F0; --line2:#CDD5E6;
    --ink:#161B26; --dim:#5C6577; --faint:#8991A3;
    --amber-dim:#FFEBCF; --green-dim:#DCF9EC; --blue-dim:#E4EAFF; --red-dim:#FFE3E5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--void);color:var(--ink);font:14px/1.55 var(--body);
  background-image:radial-gradient(1100px 500px at 85% -10%,rgba(124,156,255,.07),transparent 60%),
                   radial-gradient(900px 420px at -10% 110%,rgba(255,179,92,.04),transparent 55%);
  display:flex;justify-content:center;padding:56px 20px 80px}
::selection{background:var(--blue-dim);color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ── tab strip ─────────────────────────────────────────────────────────────
   One tab per registered workspace, pinned across the top. Clicking a tab
   opens that project (the launcher flips its proxy to that dashboard, so this
   page is replaced by it); the mini buttons start/stop its loop without
   leaving the picker. body.has-tabs reserves the strip's height - the strip
   is hidden entirely until there is at least one workspace. */
#tabstrip{position:fixed;top:0;left:0;right:0;z-index:10;display:none;align-items:center;gap:6px;
  padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
body.has-tabs #tabstrip{display:flex}
body.has-tabs{padding-top:104px}
.tab{display:flex;align-items:center;gap:2px;flex:none;background:var(--card);border:1px solid var(--line2);
  border-radius:9px;padding:2px}
.tab.is-active{background:var(--blue-dim);border-color:#2b4f86}
.tab-open{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--ink);
  font:600 12.5px var(--disp);padding:5px 9px;border-radius:7px;cursor:pointer;max-width:220px}
.tab-open:hover{background:var(--card2)}
.tab.is-active .tab-open{color:var(--blue)}
.tab-open .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-open .tslots{font:500 10px var(--mono);color:var(--dim);flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
.tab-mini{background:transparent;border:0;color:var(--dim);font:600 11px var(--disp);
  padding:5px 7px;border-radius:6px;cursor:pointer;flex:none}
.tab-mini:hover{background:var(--card2);color:var(--ink)}
.tab-mini:disabled{opacity:.4;cursor:not-allowed}
.tab-mini.go:hover{color:var(--green)} .tab-mini.halt:hover{color:var(--red)}

#shell{width:100%;max-width:640px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px}
.orbmark{font-size:40px;line-height:1}
header h1{font:700 20px var(--disp);letter-spacing:.14em;text-transform:uppercase;margin:10px 0 4px}
header .sub{font:500 12.5px var(--mono);color:var(--dim);margin:0}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.panel h2{font:600 10.5px var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}

#importForm{display:flex;gap:8px}
.in{background:var(--card);border:1px solid var(--line2);color:var(--ink);border-radius:8px;
  padding:9px 11px;font:500 12.5px var(--mono);min-width:0}
#importPath{flex:1}
.in:focus{outline:2px solid var(--blue);outline-offset:1px}
.in::placeholder{color:var(--faint)}

#createForm{display:flex;flex-direction:column;gap:8px}
#createForm .row{display:flex;gap:8px}
#createForm .row .in{flex:1}
#createForm .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.check{display:flex;align-items:center;gap:7px;font:500 11.5px var(--mono);color:var(--dim);cursor:pointer}
.check input{accent-color:var(--blue);width:14px;height:14px;flex:none}
/* Narrow screens: side-by-side name+path (and the checkbox next to Create)
   squeeze both into unreadable slivers - stack them instead. */
@media (max-width:520px){
  #createForm .row{flex-direction:column}
  #createForm .foot{flex-direction:column;align-items:stretch;gap:12px}
}

.btn{border:1px solid var(--line2);border-radius:7px;padding:8px 14px;font:600 12px var(--disp);
  letter-spacing:.02em;cursor:pointer;background:var(--card);color:var(--ink);transition:filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(1.15)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--green-dim);border-color:#1d5c40;color:var(--green)}
.btn-amber{background:var(--amber-dim);border-color:#7a5620;color:var(--amber)}
.btn-blue{background:var(--blue-dim);border-color:#2b4f86;color:var(--blue)}
.btn-ghost{background:transparent;color:var(--dim)}

#msg{min-height:18px;font:500 11.5px var(--mono);color:var(--amber);margin:0 2px 14px;text-align:center}

#projects{display:flex;flex-direction:column;gap:10px}
.empty{font:500 12.5px var(--mono);color:var(--faint);text-align:center;padding:24px 0}
.card{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.card .name{font:600 13.5px var(--disp)}
.b{font:600 9.5px var(--disp);letter-spacing:.06em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.b-ok{background:var(--green-dim);color:var(--green)}
.b-muted{background:var(--card2);color:var(--dim)}
.card .path{font:500 11px var(--mono);color:var(--faint);word-break:break-all;margin-top:2px}
.card .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<nav id="tabstrip" aria-label="Workspaces"></nav>
<div id="shell">
  <header>
    <div class="orbmark">🪐</div>
    <h1>Orbit</h1>
    <p class="sub">pick a project</p>
  </header>

  <section class="panel">
    <h2>Import a repo</h2>
    <form id="importForm">
      <input id="importPath" class="in" type="text" placeholder="/absolute/path/to/repo" autocomplete="off" spellcheck="false">
      <button class="btn btn-blue" type="submit">Import</button>
    </form>
  </section>

  <section class="panel">
    <h2>New workspace</h2>
    <form id="createForm">
      <div class="row">
        <input id="createName" class="in" type="text" placeholder="name" autocomplete="off" spellcheck="false">
        <input id="createPath" class="in" type="text" placeholder="/absolute/path/to/new/workspace" autocomplete="off" spellcheck="false">
      </div>
      <div class="foot">
        <label class="check"><input id="createProduct" type="checkbox"> product workspace (PM: insights, research, surveys)</label>
        <button class="btn btn-go" type="submit">Create</button>
      </div>
    </form>
  </section>

  <div id="msg"></div>

  <section id="projects"></section>
</div>

<script>
const TOKEN = "__TOKEN__";
const POST_HDRS = {'Content-Type': 'application/json', 'X-CC-Token': TOKEN};

function post(path, obj) {
  return fetch(path, {method: 'POST', headers: POST_HDRS, body: JSON.stringify(obj || {})})
    .then(r => r.json());
}

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setMsg(text) {
  document.getElementById('msg').textContent = text || '';
}

function renderTabs(state) {
  const strip = document.getElementById('tabstrip');
  document.body.classList.toggle('has-tabs', state.projects.length > 0);
  strip.innerHTML = state.projects.map(p => {
    // state.active is null whenever this page is the one being served (the
    // launcher proxies GET / to the dashboard as soon as a project IS active),
    // so in practice no tab is highlighted here - the highlight is honest
    // wherever the shell renders with an active project.
    const active = state.active === p.path ? ' is-active' : '';
    const slots = p.loop_running && p.loop_slots ? `${p.loop_tracked}/${p.loop_slots}` : '';
    const label = p.has_autopilot ? 'open' : 'not initialized - click to initialize';
    const controls = p.has_autopilot
      ? `<button class="tab-mini go" data-act="loop-start" data-path="${esc(p.path)}"
                 title="Start this workspace's loop">▶</button>
         <button class="tab-mini halt" data-act="loop-stop" data-path="${esc(p.path)}"
                 title="Stop this workspace's loop (leaves it stopped)">■</button>`
      : `<button class="tab-mini" data-act="init" data-path="${esc(p.path)}"
                 title="Scaffold .autopilot/">init</button>`;
    return `<div class="tab${active}">
      <button class="tab-open" data-act="${p.has_autopilot ? 'open' : 'init'}" data-path="${esc(p.path)}" title="${label}">
        <span class="dot${p.loop_running ? ' on' : ''}"></span>
        <span class="tname">${esc(p.name)}</span>
        ${slots ? `<span class="tslots">${slots}</span>` : ''}
      </button>${controls}</div>`;
  }).join('');
}

function render(state) {
  renderTabs(state);
  const list = document.getElementById('projects');
  list.innerHTML = '';
  if (!state.projects.length) {
    list.innerHTML = '<div class="empty">No projects yet — import one above.</div>';
    return;
  }
  state.projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const badges = [
      p.loop_running ? `<span class="b b-ok">running${p.loop_slots > 1 ? ` ${p.loop_tracked}/${p.loop_slots}` : ''}</span>` : '',
      !p.has_autopilot ? '<span class="b b-muted">not initialized</span>' : '',
    ].join('');
    const actionBtn = p.has_autopilot
      ? `<button class="btn btn-go" data-act="open" data-path="${esc(p.path)}">Open</button>`
      : `<button class="btn btn-amber" data-act="init" data-path="${esc(p.path)}">Initialize</button>`;
    card.innerHTML = `
      <div class="card-h"><span class="name">${esc(p.name)}</span>${badges}</div>
      <div class="path">${esc(p.path)}</div>
      <div class="btns">
        ${actionBtn}
        <button class="btn btn-ghost" data-act="remove" data-path="${esc(p.path)}">Remove</button>
      </div>`;
    list.appendChild(card);
  });
}

function refresh() {
  fetch('/_launcher/state').then(r => r.json()).then(render).catch(() => {});
}

document.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act, path = btn.dataset.path;
  if (act === 'remove' && !confirm(`Remove ${path} from the launcher?`)) return;
  const route = {open: '/_launcher/open', init: '/_launcher/init', remove: '/_launcher/remove',
                 'loop-start': '/_launcher/loop-start', 'loop-stop': '/_launcher/loop-stop'}[act];
  if (!route) return;   // unknown act: never disable a button we won't act on
  btn.disabled = true;
  post(route, {path}).then(j => {
    setMsg(j.msg || (j.ok ? 'done' : 'failed'));
    if (act === 'open' && j.ok) { location.reload(); return; }
    btn.disabled = false;
    refresh();
  }).catch(() => { setMsg('request failed'); btn.disabled = false; });
});

document.getElementById('importForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('importPath');
  const path = input.value.trim();
  if (!path) return;
  post('/_launcher/import', {path}).then(j => {
    setMsg(j.msg || (j.ok ? 'imported' : 'failed'));
    if (j.ok) input.value = '';
    refresh();
  }).catch(() => setMsg('request failed'));
});

document.getElementById('createForm').addEventListener('submit', e => {
  e.preventDefault();
  const pathInput = document.getElementById('createPath');
  const nameInput = document.getElementById('createName');
  const product = document.getElementById('createProduct').checked;
  const path = pathInput.value.trim();
  if (!path) { setMsg('a path for the new workspace is required'); return; }
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  setMsg('creating workspace…');
  post('/_launcher/create', {path, name: nameInput.value.trim(), product}).then(j => {
    setMsg(j.msg || (j.ok ? 'created' : 'failed'));
    if (j.ok) { pathInput.value = ''; nameInput.value = ''; }
    btn.disabled = false;
    refresh();
  }).catch(() => { setMsg('request failed'); btn.disabled = false; });
});

refresh();
setInterval(refresh, 4000);
</script>
</body></html>
