# Orbit project profile — the contract for `<target-repo>/.autopilot/config.yaml`.
# This file documents every field. `orbit doctor` validates a real config against it.
# The ENGINE is generic; ALL project-specific knowledge lives in the target's .autopilot/.
#
# Required: repo, base_branch, gates. Everything else has a default.

# --- identity -----------------------------------------------------------------
repo: "."                    # target repo path. "." = the dir containing .autopilot/. Absolute also fine.
base_branch: "main"          # the loop resets a worktree to origin/<base_branch> each cycle and
                             # forks per-task branches from it. NEVER pushed to directly.

# --- the model + posture ------------------------------------------------------
model: "claude-opus-4-8"     # orchestrator model (env AP_MODEL overrides). Makers may downgrade per router.
permission_mode: "acceptEdits"   # claude --permission-mode. Deletes/push stay denied via the settings file.
interval_seconds: 180        # sleep between cycles
max_tasks_per_day: 12        # hard daily cap (failed cycles count too)
cycle_timeout_seconds: 3600  # watchdog kill per cycle
concurrency: 1               # how many task cycles run in parallel. Each "slot" is one independent
                             # worker (its own worktree, its own claim); the ledger's exclusive claim
                             # guarantees no two slots ever work the same task. 1 = one worker, which
                             # is byte-for-byte today's behaviour. Raising it only matters if something
                             # actually starts that many slot loops: the background service
                             # (`orbit install`, launchd/systemd) or the launcher's per-tab
                             # Start/Stop control (`orbit web`, see README "Concurrency and the
                             # launcher"). Slot 0 alone is unaffected either way - it stays this
                             # workspace's housekeeper regardless of how many slots run.

# --- where the human gates live ------------------------------------------------
dashboard_url: "http://127.0.0.1:8787"   # linked from Slack notifications + the digest, so every
                                         # merge/escalation decision is one tap away. Change it if the
                                         # dashboard is reachable at another address (tailscale etc.).

# --- the spec the cycle re-reads each run (optional) --------------------------
spec: null                   # e.g. "docs/VISION.md" — a standing spec the orchestrator rereads so it
                             # doesn't drift. null = no standing spec (task contracts alone govern).

# --- GATES: the whole decoupling. How the checker verifies THIS repo. ---------
# The checker runs each gate's `cmd` in `cwd` (relative to repo) and must see it pass
# before a task is committed. `needs` lists preflight deps the loop checks are up first
# (built-in checks: postgres, mysql, redis, docker, node, python). An unknown `needs`
# value is treated as a shell test: `<value>` must exit 0.
gates:
  # example — replace with your repo's real gates (orbit init auto-detects these):
  test:
    cmd: "pytest -q"
    cwd: "."
    needs: []              # e.g. [postgres]
  # frontend:
  #   cmd: "npm test -- --watchAll=false"
  #   cwd: "frontend"
  # typecheck:
  #   cmd: "npm run typecheck"
  #   cwd: "frontend"

# --- WORKABLE categories (auto-pickable). Others escalate unless forced. -------
# The router (router.yaml, engine default overridable per-repo) maps each category to
# maker/model/skill/tracks. This just says which the loop may AUTO-pick.
workable_categories: [bug, feature, refactor, code_quality, testing, documentation, dependencies, developer_experience]

# --- task sources feeding the backlog -----------------------------------------
# `backlog` is native (a human-curated backlog.yaml). Every other name is a SIGNAL
# adapter `<name>_to_backlog.py` — resolved from the target's .autopilot/adapters/
# first (ship your own feeds), then the engine's adapters/. Adapters append
# `status: proposed` tasks only; a human queues work. Contract details:
# backlog_to_tasks.run_source_adapters.
sources: [backlog]           # + optional: foundry, logwatch, qa, or your own

# --- environment passthrough (NEVER commit secrets; reference env only) -------
env:
  # CLAUDE_BIN: "auto"       # "auto" = command -v claude. Or an absolute path.
  # extra_ca_certs: null     # path to a corporate root CA (Zscaler etc.) if outbound TLS needs it
  # passthrough: []          # names of env vars to export into the cycle (e.g. TRINO_HOST) — values from your shell, not here

# --- git identity for the wrapper's per-task branches -------------------------
branch_prefix: "autopilot"   # ships push to origin/<branch_prefix>/task-<id>
commit_trailer: "Co-Authored-By: Claude <noreply@anthropic.com>"

# --- runtime verification (optional): prove ships in the RUNNING product -------
# After the cycle commits and BEFORE the wrapper pushes, a runtime agent launches
# (or attaches to) the app and drives the exact flow the acceptance criteria name;
# its evidence lands in the review packet. Only listed categories are checked.
# `evidence` never blocks; `required` escalates instead of shipping when observed
# behaviour CONTRADICTS a criterion (unable-to-run is never a failure). No block
# → no runtime checks (default). Superseded by qa: when both present.
# runtime_check:
#   launch: "npm run dev"            # optional — how the agent starts the app
#   url: "http://localhost:3000"     # optional — where to reach it
#   timeout_seconds: 900
#   categories:
#     frontend: required
#     feature: evidence

# --- jira as a task source (optional, wrapper-only credentials) ----------------
# Requires `jira` in sources: above. A human applying `ready_label` to a ticket is
# the triage act: the adapter exports the ticket, an enrichment agent surveys the
# code and drafts a gated task contract (or comments specific questions back on the
# ticket when it's too thin to build). Ships/merges/rejections are commented back.
# Credentials live in $AP_STATE/.jira_token (auto-gitignored) — basic: `email:api_token`
# (cloud), bearer: a PAT (server/DC). Agents never see the token; all REST is engine-side.
# jira:
#   base_url: "https://<org>.atlassian.net"
#   project: "CDP"                 # issues considered (JQL project =)
#   ready_label: "orbit-ready"     # human sets this label = human triage act
#   auth: "basic"                  # "basic" | "bearer"
#   auto_queue: false              # true → enriched, gate-passing imports land queued/allow
#                                  # (the label WAS the queue act). Merge stays human always.
#   writeback: true                # comment PR url / merged / rejected back on the ticket
#   on_merge_transition: null      # e.g. "Done" — transition applied after a merge comment
#   max_imports_per_poll: 3        # enrichment is a model call; bound it per poll
#   enrich_timeout_seconds: 900

# --- project knowledge base (optional) ----------------------------------------
# Generated by `orbit knowledge build` (LLM survey of the repo — no live DB),
# written to .autopilot/knowledge/ (committed, reviewed like code) and briefed
# into every cycle when present (presence of knowledge/INDEX.md is the switch;
# this block only tunes refresh behavior).
# knowledge:
#   refresh: "manual"            # "manual" | "auto" (loop refreshes between cycles when stale)
#   stale_after_merges: 3        # auto: refresh once >=N merged ships touch mapped files
#   timeout_seconds: 1800        # cap on the headless survey call

# --- task-level planning (optional) -------------------------------------------
# Before the build loop, a planner subagent writes a justified per-task plan
# (approach, file-scope fence, applicable standards) into the review packet;
# the maker is briefed with it and the verifier fails any off-plan diff.
# plan:
#   categories: [bug, feature, refactor, code_quality, testing]  # which tasks get planned
#   enforce: "verifier"        # "verifier" (LLM judges the fence) | "block" (wrapper refuses
#                              #  to push off-plan commits — exit 3 → escalate)
#   model: "sonnet"            # planner model (router defaults.planner overrides)

# --- QA runtime (optional): a browser-driving QA agent proves ships, replays taught
# flows, and files failures back onto the task. Requires node+npx in the target env
# (Playwright MCP is fetched via npx — never an engine dependency). When present,
# this supersedes runtime_check: as the post-commit gate.
# qa:
#   services:                          # full-stack launch recipe, in start order
#     - name: api
#       launch: "npm run dev:api"      # command; run from `cwd` inside the worktree
#       cwd: "server"                  # optional, default "."
#       ready: "http://localhost:4000/health"   # optional; polled until HTTP 200
#     - name: web
#       launch: "npm run dev"
#       ready: "http://localhost:3000"
#   base_url: "http://localhost:3000"  # where the browser starts (required with services)
#   flows_dir: "qa/flows"  # under .autopilot/, committed
#   env: {PORT: "3000"}                # exported into service launches (dedicated QA ports)
#   ready_timeout_seconds: 90
#   timeout_seconds: 1200              # whole QA-agent budget per invocation
#   model: "sonnet"                    # QA runs are frequent — cheaper than the maker
#   mcp_config: null                   # path to your own mcp json; null → engine auto-generates
#   browser: "chromium"
#   headless: true
#   max_bounces: 2                     # QA→dev re-files before escalating to a human
#   gate_categories:                   # replaces runtime_check.categories when qa: present
#     frontend: required               # required = QA fail blocks the ship (bounce/escalate)
#     feature: required
#     bug: evidence                    # evidence only, never blocks
#   regression:
#     on_merge: true                 # sweep approved flows when origin/<base> moves
#     schedule_hours: 24             # independent cadence (0 = off)
#     max_flows_per_run: 10          # cap per sweep
#   exploratory:
#     enabled: false                 # scheduled exploratory crawl → ops/qa/SEEN.md rows
#     max_pages: 10

# --- MCP servers (optional) ---------------------------------------------------
# MCP (Model Context Protocol) servers the cycle may reach, configured here with
# transport, credentials, and tool allowlists (spec section 3).
#
# Where the token itself lives (spec decision 10): .autopilot/.secrets.env, one
# KEY=VALUE per line, mode 0600, gitignored. Write it with the dashboard's
# Settings > Secrets panel (which is also what keeps the .gitignore entry in
# place), or by hand. It is NOT in this file and NOT in git: config.yaml only
# names the variable, and the generated MCP config only carries a ${VAR}
# reference that Claude Code expands from the environment at run time. run.sh
# loads .secrets.env once per iteration, so a token saved in the panel reaches
# the next cycle without a restart.
# mcp:
#   metaql:                          # server name → mcp__metaql__* tool prefix
#     transport: http                # http | stdio
#     url: "https://<host>/mcp"      # http only
#     token_env: METAQL_TOKEN        # optional; sent as `Authorization: Bearer ${METAQL_TOKEN}` —
#                                    # the ${VAR} is expanded by Claude Code at run time; the
#                                    # value comes from .autopilot/.secrets.env (see above), so
#                                    # the token never lands in config.yaml or in the repo
#     tools: [metaql_execute_query]  # REQUIRED — "*" = allow every tool on this server;
#                                    # a list allows only those tools; absent/empty allows none
#   figma:
#     transport: stdio
#     command: npx
#     args: ["-y", "figma-mcp"]
#     env_passthrough: [FIGMA_TOKEN] # env var names forwarded to the server process as ${VAR}
#     tools: "*"

# --- metric watches (optional, product workspaces) -----------------------------
# Standing questions re-filed on a cadence via the `metric_watch` signal adapter
# (requires `metric_watch` in sources: above). State lives in
# `$AP_STATE/watches.json` (`{name: last_filed_iso}`); a watch past its cadence
# files ONE `status: proposed` task (id `watch-<name>-<YYYYMMDD>`, UTC) with the
# insight_lint acceptance criterion - never queued, a human promotes it.
# watches:
#   - name: wow-signup-conversion   # slug: ^[a-z0-9][a-z0-9-]*$
#     question: "What's the week-over-week change in signup conversion, and why?"
#     cadence_hours: 168            # optional, positive int; default 168 (weekly)
#     category: insight             # optional: insight | funnel | hypothesis; default insight
#
# Fetches worth repeating are saved as named scrapers, independent of watches:
# `.autopilot/scrapers/<name>.json` - saved read-only extractors; engine/browse.py rerun <target> <name>.

# --- PRD pipeline (optional, product workspaces) -------------------------------
# Tunes the headless `claude` call prd_flow.py makes per stage (intake, research,
# synthesis, draft, review — driven from the dashboard's PRD view, see
# `prd_flow.py` and `docs/superpowers/specs/`). No block needed to use the
# pipeline; these just override its defaults.
# prd:
#   model: "claude-opus-4-8"      # per-stage model (this is already the default)
#   timeout_seconds: 3600         # cap on each stage's headless call (also the default)

# --- pull requests (optional, wrapper-only) ------------------------------------
# "github" → after pushing a ship, the WRAPPER (never the agent) runs `gh pr create`
# against base_branch with the review packet as the PR body, and records the URL in
# the ledger. Merging stays 100% manual — Orbit never merges. Requires an
# authenticated `gh` on PATH; if it's missing or the create fails, the cycle just
# logs and continues (the branch is pushed either way).
pull_requests: "off"         # "off" | "github"
